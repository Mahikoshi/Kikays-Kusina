<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <title>Profile</title>
</head>
<body>
    <div class="app">
  <div class="topbar">
   <a href="home.html">
    <img src="Pics\arrow.png" alt="arrow" style="width: 24px; height: 24px; object-fit: contain;" />
   </a>
    <i class="ti ti-menu-2" aria-label="Menu"></i>
  </div>
  <div class="body">
    <div class="profile-row">
      <div class="avatar">
        <img src="Pics\profile.png" alt="User avatar" style="width:100%; height:100%; object-fit:cover; border-radius:50%;"/>
    </div>
      <div class="info-card">
        <div class="info-main">
          <h2>User name</h2>
          <p>@email</p>
          <p>091234567</p>
        </div>
        <div class="info-address">
          <div class="address-label">
            <i class="ti ti-map-pin" aria-hidden="true"></i>
            <h2>Address</h2>
          </div>
          <p>example address, adress, adress</p>
        </div>
        <button class="edit-btn" aria-label="Edit profile">
          <i class="ti ti-edit" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
