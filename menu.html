<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kikay's Kusina — Menu</title>
  <link rel="stylesheet" href="menu-style.css" />
</head>
<body>

<div class="page-wrapper">

  <!-- ── Top Nav ──────────────────────────────── -->
  <nav class="topnav">
    <div class="topnav-pill">
      <a href="#">Home</a>
      <a href="#" class="active">Menu</a>
      <a href="#">About Us</a>
      <a href="#">Service</a>
    </div>
  </nav>

  <!-- ── Sidebar ──────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-brand">Kikay's<br>Kusina</div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <button class="nav-item active" data-category="Pork">
        <span class="nav-icon">
          <!-- pork / meat icon -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a4 4 0 0 0-8 0c0 1.5.5 2.8 1.3 3.8L9 17h6l-2.3-5.2A6 6 0 0 0 18 8z"/>
            <line x1="9" y1="17" x2="15" y2="17"/>
            <path d="M12 17v2"/>
          </svg>
        </span>
        Pork
      </button>
      <button class="nav-item" data-category="Chicken">
        <span class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </span>
        Chicken
      </button>
      <button class="nav-item" data-category="Seafood">
        <span class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 6.5c-1 2-1 4 0 6s3 4 5.5 4 4.5-2 5.5-4-1-4-1-6c-1-1-3-2-5-2s-4 1-5 2z"/>
            <path d="M17 6l2-2"/>
            <path d="M19 9h2"/>
            <path d="M18 12l2 1"/>
          </svg>
        </span>
        Seafood
      </button>
      <button class="nav-item" data-category="Dessert">
        <span class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
            <line x1="6" y1="1" x2="6" y2="4"/>
            <line x1="10" y1="1" x2="10" y2="4"/>
            <line x1="14" y1="1" x2="14" y2="4"/>
          </svg>
        </span>
        Dessert
      </button>
      <button class="nav-item" data-category="Beef">
        <span class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="8" width="20" height="12" rx="3"/>
            <path d="M6 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/>
            <line x1="12" y1="12" x2="12" y2="16"/>
            <line x1="8" y1="14" x2="16" y2="14"/>
          </svg>
        </span>
        Beef
      </button>
      <button class="nav-item" data-category="Best Seller">
        <span class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </span>
        Best Seller
      </button>
      <button class="nav-item" data-category="Packages">
        <span class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l19-9-9 19-2-8-8-2z"/>
          </svg>
        </span>
        Packages
      </button>
    </nav>
  </aside>

  <!-- ── Main Content ─────────────────────────── -->
  <main class="main-content">
    <div class="main-header">
      <h1 class="greeting">Hey, User!</h1>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="text" placeholder="What are your cravings..." aria-label="Search menu" />
      </div>
    </div>

    <!-- Hero -->
    <div class="hero-banner">
      <img src="https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=1200" alt="Featured Filipino food" />
    </div>

    <!-- Category section -->
    <section class="category-section">
      <div class="category-header">
        <h2 class="category-title" id="category-title">Pork</h2>
        <button class="view-all-btn" id="view-all-btn">
          View All
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
      <div class="menu-grid" id="menu-grid">
        <!-- Populated by menu-logic.js -->
      </div>
    </section>
  </main>

  <!-- ── Cart Panel ────────────────────────────── -->
  <aside class="cart-panel">
    <h2 class="cart-title">My Cart</h2>

    <div id="address-block" class="cart-address-block">
      <!-- Populated by PHP or JS -->
    </div>

    <div class="cart-items" id="cart-items">
      <!-- Populated by menu-logic.js -->
    </div>

    <hr class="cart-divider" />

    <div class="cart-totals">
      <div class="cart-row">
        <span>Subtotal:</span>
        <span id="cart-subtotal">$0.00</span>
      </div>
      <div class="cart-row">
        <span>Delivery fee:</span>
        <span id="cart-delivery">$0.00</span>
      </div>
      <hr class="cart-divider" />
      <div class="cart-row total">
        <span>Total:</span>
        <span id="cart-total">$0.00</span>
      </div>
    </div>

    <button class="checkout-btn" id="checkout-btn">CHECKOUT</button>
  </aside>

</div>

<script src="menu-logic.js"></script>
</body>
</html>
